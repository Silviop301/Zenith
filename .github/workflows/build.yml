name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish zenith.exe, zenith-probe.exe and zenith-service.exe
        run: |
          dotnet publish src/Zenith.App -c Release -o publish
          dotnet publish src/Zenith.Probe -c Release -o publish
          dotnet publish src/Zenith.Service -c Release -o publish
          Copy-Item scripts/*.ps1 publish/

      # Renders every screen to PNG: the made-up PC (--demo) and this CI machine as it is, with the
      # service not installed yet. Fails if the app throws while building a screen.
      - name: App screenshots
        run: |
          foreach ($run in @(@{ dir = 'telas/demo'; args = '--screenshot telas/demo --demo' }, @{ dir = 'telas/ci'; args = '--screenshot telas/ci' })) {
            New-Item -ItemType Directory -Force $run.dir | Out-Null
            $p = Start-Process -FilePath publish/zenith.exe -ArgumentList $run.args -Wait -PassThru
            if (Test-Path "$($run.dir)/erro.txt") { Get-Content "$($run.dir)/erro.txt" }
            if ($p.ExitCode -ne 0) { throw "zenith.exe $($run.args) failed ($($p.ExitCode))" }
            Get-ChildItem $run.dir
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenith-telas
          path: telas/

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=0.1.$env:GITHUB_RUN_NUMBER" installer\zenith.iss
          if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
          Get-ChildItem publish/installer

      # Smoke test: the CI machine has no real monitor or GPU, so findings will mostly be
      # "não se aplica" or "erro"; this only checks the probe runs to the end and writes a report.
      - name: Run probe
        run: ./publish/zenith-probe.exe --no-wait --out publish/zenith-relatorio-ci.json

      # End to end on a real Windows, through the installer: install silently, provoke finding 3 with the
      # power saver plan, fix it through the service, undo everything, then uninstall and check nothing is left.
      - name: Installer and service end-to-end (power plan)
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem publish/installer/zenith-setup-*.exe).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup failed ($($p.ExitCode))" }
          $app = Join-Path $env:ProgramFiles 'Zenith'
          $probe = Join-Path $app 'zenith-probe.exe'
          Get-ChildItem $app
          Get-Service Zenith
          # "Start with Windows" is on by default; the app reads this on its first run for each user.
          if ((Get-ItemProperty HKLM:\Software\Zenith).StartWithWindows -ne 1) { throw 'start-with-Windows default not written' }

          & $probe servico
          if ($LASTEXITCODE -ne 0) { throw 'service not reachable' }

          # The service reads the sensors as soon as it starts; memory use is there on any PC.
          Start-Sleep -Seconds 5
          $sensors = & $probe sensores
          $sensors
          if (-not ($sensors -match 'memory.usage')) { throw 'sensor collection wrote nothing' }

          $original = (powercfg /getactivescheme)
          powercfg /setactive a1841308-3541-4fab-bc81-f71556f20b4a
          $saver = (powercfg /getactivescheme)

          & $probe aplicar energia
          if ($LASTEXITCODE -ne 0) { throw 'apply failed' }
          if ((powercfg /getactivescheme) -notmatch '381b4222-f694-41f0-9685-ff5bb260df2e') { throw 'plan was not switched to Balanced' }
          & $probe diario

          # A silent uninstall undoes every active change before removing the service.
          Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands off to a copy of itself in %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Get-ChildItem $app; throw 'install folder was not removed' }
          if (Get-Service Zenith -ErrorAction SilentlyContinue) { throw 'service was not removed' }
          if (Test-Path HKLM:\Software\Zenith) { throw 'installer registry key was not removed' }
          if (Test-Path (Join-Path $env:ProgramData 'Zenith')) { throw 'journal was kept although everything was undone' }
          if ((powercfg /getactivescheme) -ne $saver) { throw 'uninstall did not undo the power plan change' }

          powercfg /setactive ($original -replace '.*:\s*([0-9a-f-]{36}).*', '$1')

      - name: Service logs (on failure)
        if: failure()
        run: |
          Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'zenith' -or $_.Message -match 'zenith' } |
            Format-List TimeCreated, ProviderName, LevelDisplayName, Message

      - uses: actions/upload-artifact@v4
        with:
          name: zenith
          path: |
            publish/zenith.exe
            publish/zenith-probe.exe
            publish/zenith-service.exe
            publish/*.ps1
            publish/installer/*.exe
            publish/zenith-relatorio-ci.json

name: build

on:
  push:
    branches: [main]
  pull_request:
  # "Publicar versão": the same build and tests, then the installer goes to the public releases repository,
  # where installed copies of Zenith find it (src/Zenith.App/Updates/Updater.cs). Only from main.
  workflow_dispatch:
    inputs:
      notas:
        description: O que mudou nesta versão
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish zenith.exe, zenith-probe.exe and zenith-service.exe
        run: |
          dotnet publish src/Zenith.App -c Release -o publish -p:Version=$env:VERSION
          dotnet publish src/Zenith.Probe -c Release -o publish -p:Version=$env:VERSION
          dotnet publish src/Zenith.Service -c Release -o publish -p:Version=$env:VERSION
          Copy-Item scripts/*.ps1 publish/

      # The installer's copy: the three in one folder over one runtime, instead of three single-file exes that
      # each carry their own. The service goes last so its newer EventLog libraries win (same assembly version).
      - name: Publish the installer's folder
        run: |
          foreach ($project in 'Zenith.App', 'Zenith.Probe', 'Zenith.Service') {
            dotnet publish src/$project -c Release -o publish/instalacao -p:PublishSingleFile=false -p:SharedInstall=true -p:Version=$env:VERSION
            if ($LASTEXITCODE -ne 0) { throw "publish $project failed" }
          }
          "{0:N0} MB in {1} files" -f ((Get-ChildItem publish/instalacao -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), (Get-ChildItem publish/instalacao -Recurse -File).Count

      # Renders every screen to PNG: the made-up PC (--demo) and this CI machine as it is, with the
      # service not installed yet. Fails if the app throws while building a screen.
      - name: App screenshots
        run: |
          foreach ($run in @(@{ dir = 'telas/demo'; args = '--screenshot telas/demo --demo' }, @{ dir = 'telas/ci'; args = '--screenshot telas/ci' })) {
            New-Item -ItemType Directory -Force $run.dir | Out-Null
            $p = Start-Process -FilePath publish/zenith.exe -ArgumentList $run.args -Wait -PassThru
            if (Test-Path "$($run.dir)/erro.txt") { Get-Content "$($run.dir)/erro.txt" }
            if ($p.ExitCode -ne 0) { throw "zenith.exe $($run.args) failed ($($p.ExitCode))" }
            Get-ChildItem $run.dir
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenith-telas
          path: telas/

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\zenith.iss
          if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
          Get-ChildItem publish/installer

      # Smoke test: the CI machine has no real monitor or GPU, so findings will mostly be
      # "não se aplica" or "erro"; this only checks the probe runs to the end and writes a report.
      - name: Run probe
        run: ./publish/zenith-probe.exe --no-wait --out publish/zenith-relatorio-ci.json

      # Bestiário on a real Windows: processes, startup entries, signatures (through catalogs too) and network.
      # Windows' own programs must come out as protectors; that is what keeps rule 4.
      - name: Bestiário (read only)
        run: |
          $out = ./publish/zenith-probe.exe bestiario
          $out
          if ($LASTEXITCODE -ne 0) { throw 'bestiario failed' }
          if (-not ($out -match 'svchost.exe')) { throw 'svchost.exe was not read' }
          if (-not ($out -match 'assinado pela Microsoft')) { throw 'no Microsoft signature was recognized' }

      # End to end on a real Windows, through the installer: install silently, provoke finding 3 with the
      # power saver plan, fix it through the service, undo everything, then uninstall and check nothing is left.
      - name: Installer and service end-to-end (power plan)
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem publish/installer/zenith-setup-*.exe).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup failed ($($p.ExitCode))" }
          $app = Join-Path $env:ProgramFiles 'Zenith'
          $probe = Join-Path $app 'zenith-probe.exe'
          Get-ChildItem $app
          Get-Service Zenith
          # "Start with Windows" is on by default; the app reads this on its first run for each user.
          if ((Get-ItemProperty HKLM:\Software\Zenith).StartWithWindows -ne 1) { throw 'start-with-Windows default not written' }
          if ((Get-ItemProperty HKLM:\Software\Zenith).InstallDir -ne $app) { throw 'install folder not recorded for updates' }

          # The installed app (shared runtime, not single-file) starts and draws its screens.
          $p = Start-Process -FilePath (Join-Path $app 'zenith.exe') -ArgumentList '--screenshot telas/instalado' -Wait -PassThru
          if (Test-Path telas/instalado/erro.txt) { Get-Content telas/instalado/erro.txt }
          if ($p.ExitCode -ne 0) { throw "installed zenith.exe failed ($($p.ExitCode))" }

          & $probe servico
          if ($LASTEXITCODE -ne 0) { throw 'service not reachable' }

          # The service reads the sensors as soon as it starts; memory use is there on any PC.
          Start-Sleep -Seconds 5
          $sensors = & $probe sensores
          $sensors
          if (-not ($sensors -match 'memory.usage')) { throw 'sensor collection wrote nothing' }

          $original = (powercfg /getactivescheme)
          powercfg /setactive a1841308-3541-4fab-bc81-f71556f20b4a
          $saver = (powercfg /getactivescheme)

          & $probe aplicar energia
          if ($LASTEXITCODE -ne 0) { throw 'apply failed' }
          if ((powercfg /getactivescheme) -notmatch '381b4222-f694-41f0-9685-ff5bb260df2e') { throw 'plan was not switched to Balanced' }
          # Bestiário: "impedir de iniciar" for a machine-wide entry (through the service) and a user one (here),
          # and Windows' own programs refused. An unsigned copy of the probe stands in for a third-party program.
          $approved = 'Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run'
          $run = 'Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -ItemType Directory -Force C:\ZenithTeste | Out-Null
          Copy-Item publish/zenith-probe.exe C:\ZenithTeste\teste-inicializacao.exe
          New-ItemProperty -Path "HKLM:\$run" -Name ZenithTeste -Value '"C:\ZenithTeste\teste-inicializacao.exe" --x' -Force | Out-Null
          New-ItemProperty -Path "HKCU:\$run" -Name ZenithTeste -Value '"C:\ZenithTeste\teste-inicializacao.exe" --y' -Force | Out-Null
          New-ItemProperty -Path "HKLM:\$run" -Name ZenithTesteWindows -Value 'C:\Windows\System32\notepad.exe' -Force | Out-Null
          & $probe impedir 'machine-run|ZenithTeste'
          if ($LASTEXITCODE -ne 0) { throw 'machine startup entry was not stopped' }
          & $probe impedir 'user-run|ZenithTeste'
          if ($LASTEXITCODE -ne 0) { throw 'user startup entry was not stopped' }
          if ((Get-ItemProperty "HKLM:\$approved").ZenithTeste[0] -ne 3) { throw 'machine entry is not off in StartupApproved' }
          if ((Get-ItemProperty "HKCU:\$approved").ZenithTeste[0] -ne 3) { throw 'user entry is not off in StartupApproved' }
          & $probe impedir 'machine-run|ZenithTesteWindows'
          if ($LASTEXITCODE -eq 0) { throw 'a Windows program was stopped from starting' }
          & $probe diario

          # A silent uninstall undoes every active change before removing the service.
          Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands off to a copy of itself in %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Get-ChildItem $app; throw 'install folder was not removed' }
          if (Get-Service Zenith -ErrorAction SilentlyContinue) { throw 'service was not removed' }
          if (Test-Path HKLM:\Software\Zenith) { throw 'installer registry key was not removed' }
          if (Test-Path (Join-Path $env:ProgramData 'Zenith')) { throw 'journal was kept although everything was undone' }
          if ((powercfg /getactivescheme) -ne $saver) { throw 'uninstall did not undo the power plan change' }
          if ((Get-ItemProperty "HKLM:\$approved").ZenithTeste[0] -ne 2) { throw 'uninstall did not turn the machine startup entry back on' }
          if ((Get-ItemProperty "HKCU:\$approved").ZenithTeste[0] -ne 2) { throw 'uninstall did not turn the user startup entry back on' }
          foreach ($hive in 'HKLM', 'HKCU') {
            Remove-ItemProperty -Path "$($hive):\$run" -Name ZenithTeste, ZenithTesteWindows -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path "$($hive):\$approved" -Name ZenithTeste -ErrorAction SilentlyContinue
          }

          powercfg /setactive ($original -replace '.*:\s*([0-9a-f-]{36}).*', '$1')

      - name: Service logs (on failure)
        if: failure()
        run: |
          Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'zenith' -or $_.Message -match 'zenith' } |
            Format-List TimeCreated, ProviderName, LevelDisplayName, Message

      - uses: actions/upload-artifact@v4
        with:
          name: zenith
          path: |
            publish/zenith.exe
            publish/zenith-probe.exe
            publish/zenith-service.exe
            publish/*.ps1
            publish/installer/*.exe
            publish/zenith-relatorio-ci.json

      # Only on "Publicar versão" (Actions → build → Run workflow, on main).
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.ZENITH_VERSOES_TOKEN }}
          NOTAS: ${{ github.event.inputs.notas }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'Secret ZENITH_VERSOES_TOKEN is missing.' }
          $repo = 'Silviop301/zenith-versoes'
          $setup = Get-Item publish/installer/zenith-setup-$env:VERSION.exe
          $manifest = [ordered]@{
            version = $env:VERSION
            url = "https://github.com/$repo/releases/download/v$env:VERSION/$($setup.Name)"
            sha256 = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            size = $setup.Length
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM versao.json
          Get-Content versao.json
          $notes = if ($env:NOTAS) { $env:NOTAS } else { "Zenith $env:VERSION" }
          gh release create "v$env:VERSION" $setup.FullName versao.json --repo $repo --title "Zenith $env:VERSION" --notes $notes --latest

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish zenith.exe, zenith-probe.exe and zenith-service.exe
        run: |
          dotnet publish src/Zenith.App -c Release -o publish
          dotnet publish src/Zenith.Probe -c Release -o publish
          dotnet publish src/Zenith.Service -c Release -o publish
          Copy-Item scripts/*.ps1 publish/

      # Renders every screen to PNG: the made-up PC (--demo) and this CI machine as it is, with the
      # service not installed yet. Fails if the app throws while building a screen.
      - name: App screenshots
        run: |
          foreach ($run in @(@{ dir = 'telas/demo'; args = '--screenshot telas/demo --demo' }, @{ dir = 'telas/ci'; args = '--screenshot telas/ci' })) {
            New-Item -ItemType Directory -Force $run.dir | Out-Null
            $p = Start-Process -FilePath publish/zenith.exe -ArgumentList $run.args -Wait -PassThru
            if (Test-Path "$($run.dir)/erro.txt") { Get-Content "$($run.dir)/erro.txt" }
            if ($p.ExitCode -ne 0) { throw "zenith.exe $($run.args) failed ($($p.ExitCode))" }
            Get-ChildItem $run.dir
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenith-telas
          path: telas/

      # Smoke test: the CI machine has no real monitor or GPU, so findings will mostly be
      # "não se aplica" or "erro"; this only checks the probe runs to the end and writes a report.
      - name: Run probe
        run: ./publish/zenith-probe.exe --no-wait --out publish/zenith-relatorio-ci.json

      # End to end on a real Windows: install the service, provoke finding 3 with the power saver plan,
      # fix it through the service, then undo everything and check Windows is back where it started.
      - name: Service end-to-end (power plan)
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/instalar-servico.ps1 -ExePath publish/zenith-service.exe
          ./publish/zenith-probe.exe servico
          if ($LASTEXITCODE -ne 0) { throw 'service not reachable' }

          $original = (powercfg /getactivescheme)
          powercfg /setactive a1841308-3541-4fab-bc81-f71556f20b4a
          $saver = (powercfg /getactivescheme)

          ./publish/zenith-probe.exe aplicar energia
          if ($LASTEXITCODE -ne 0) { throw 'apply failed' }
          if ((powercfg /getactivescheme) -notmatch '381b4222-f694-41f0-9685-ff5bb260df2e') { throw 'plan was not switched to Balanced' }

          ./publish/zenith-probe.exe diario
          ./publish/zenith-probe.exe desfazer-tudo
          if ($LASTEXITCODE -ne 0) { throw 'undo failed' }
          if ((powercfg /getactivescheme) -ne $saver) { throw 'undo did not restore the power saver plan' }

          powercfg /setactive ($original -replace '.*:\s*([0-9a-f-]{36}).*', '$1')
          ./scripts/remover-servico.ps1

      - name: Service logs (on failure)
        if: failure()
        run: |
          Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'zenith' -or $_.Message -match 'zenith' } |
            Format-List TimeCreated, ProviderName, LevelDisplayName, Message

      - uses: actions/upload-artifact@v4
        with:
          name: zenith
          path: |
            publish/zenith.exe
            publish/zenith-probe.exe
            publish/zenith-service.exe
            publish/*.ps1
            publish/zenith-relatorio-ci.json

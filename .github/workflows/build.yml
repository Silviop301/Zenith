name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish zenith-probe.exe
        run: dotnet publish src/Zenith.Probe -c Release -o publish

      # Smoke test: the CI machine has no real monitor or GPU, so findings will mostly be
      # "não se aplica" or "erro"; this only checks the probe runs to the end and writes a report.
      - name: Run probe
        run: ./publish/zenith-probe.exe --no-wait --out publish/zenith-relatorio-ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: zenith-probe
          path: |
            publish/zenith-probe.exe
            publish/zenith-relatorio-ci.json

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ícone do modo gamer: estados</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(107,91,142,0)}50%{box-shadow:0 0 0 5px rgba(107,91,142,.22)}}
@keyframes pulsewarn{0%,100%{box-shadow:0 0 0 0 rgba(138,102,48,0)}50%{box-shadow:0 0 0 5px rgba(138,102,48,.25)}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.pulsewarn{animation:pulsewarn 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse,.pulsewarn{animation:none}}
</style>
<style>body{margin:0}</style>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background:#E6E8EC"><div style="width: 720px; height: 280px; box-sizing: border-box; padding: 28px; background: #F2F3F5; font-family: 'Manrope', system-ui, sans-serif; color: #1A1D24; display: flex; flex-direction: column; gap: 18px">
  <h1 style="margin: 0; font-size: 16px; font-weight: 800">Ícone na barra de tarefas</h1>
  <div style="display: flex; gap: 14px; flex: 1">

    <div style="flex: 1; box-sizing: border-box; padding: 18px; background: #FFFFFF; border: 1px solid #E4E6EB; border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="position: relative; width: 52px; height: 52px; border-radius: 12px; background: #F3F4F6; border: 1px solid #DADDE3; color: #6B7180; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9.5 10l1.8 1.8L15 8.2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 800">Desligado</span><span style="font-size: 12px; line-height: 1.5; color: #5B6170">Nada alterado no PC.</span></div>
    </div>

    <div style="flex: 1; box-sizing: border-box; padding: 18px; background: #FFFFFF; border: 1px solid #E4E6EB; border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="position: relative; width: 52px; height: 52px; border-radius: 12px; background: #F3F4F6; border: 1px solid #DADDE3; color: #1A1D24; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9.5 10l1.8 1.8L15 8.2"></path></svg>
        <span class="pulse" style="position: absolute; right: 7px; top: 7px; width: 10px; height: 10px; border-radius: 999px; background: #6B5B8E; border: 2px solid #F3F4F6"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 800">Ativo</span><span style="font-size: 12px; line-height: 1.5; color: #5B6170">Sessão em andamento. Passe o mouse para ver temperatura e uso.</span></div>
    </div>

    <div style="flex: 1; box-sizing: border-box; padding: 18px; background: #FFFFFF; border: 1px solid #E4E6EB; border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="position: relative; width: 52px; height: 52px; border-radius: 12px; background: #F3F4F6; border: 1px solid #DADDE3; color: #1A1D24; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9.5 10l1.8 1.8L15 8.2"></path></svg>
        <span class="pulsewarn" style="position: absolute; right: 7px; top: 7px; width: 10px; height: 10px; border-radius: 999px; background: #B07F2E; border: 2px solid #F3F4F6"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 800">Alerta de temperatura</span><span style="font-size: 12px; line-height: 1.5; color: #5B6170">Passou do limite de aviso. O ponto pisca, sem tirar você do jogo.</span></div>
    </div>

  </div>
</div></div>
</body>
</html>

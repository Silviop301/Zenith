<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith: monograma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes glow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.dot{transform-box:fill-box;transform-origin:center;animation:glow .9s cubic-bezier(.2,.7,.2,1) .5s both}
@media (prefers-reduced-motion: reduce){.rise,.dot{animation:none}}
</style>
<style>body{margin:0}</style>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background:#E6E8EC"><div style="width: 880px; height: 600px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Manrope', system-ui, sans-serif; color: #172036">
  <div style="flex: 1; display: flex">
    <div class="rise" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 22px; background: #F2F3F5">
      <svg role="img" aria-label="Monograma Zenith" width="104" height="104" viewBox="0 0 64 64">
        <path d="M18 24 H46 L18 50 H46" fill="none" stroke="#172036" stroke-width="5.5" stroke-linejoin="miter" stroke-linecap="square"></path>
        <circle class="dot" cx="32" cy="12" r="4.2" fill="#172036"></circle>
      </svg>
      <span style="font-size: 64px; font-weight: 800; letter-spacing: -0.03em; color: #172036">Zenith</span>
    </div>
    <div class="rise" style="flex: 0 0 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #172036">
      <svg role="img" aria-label="Monograma Zenith em versão clara" width="104" height="104" viewBox="0 0 64 64">
        <path d="M18 24 H46 L18 50 H46" fill="none" stroke="#F4F1EA" stroke-width="5.5" stroke-linejoin="miter" stroke-linecap="square"></path>
        <circle class="dot" cx="32" cy="12" r="4.2" fill="#F4F1EA"></circle>
      </svg>
      <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; color: #F4F1EA">Zenith</span>
    </div>
  </div>
  <div style="flex: 0 0 150px; box-sizing: border-box; padding: 0 40px; border-top: 1px solid #E4E6EB; display: flex; align-items: center; gap: 40px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: #172036; display: flex; align-items: center; justify-content: center">
        <svg role="img" aria-label="Ícone do app, 64 pixels" width="44" height="44" viewBox="0 0 64 64"><path d="M18 24 H46 L18 50 H46" fill="none" stroke="#F4F1EA" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"></path><circle cx="32" cy="12" r="4.6" fill="#F4F1EA"></circle></svg>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #5B6170">Ícone · 64 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #172036; display: flex; align-items: center; justify-content: center">
        <svg role="img" aria-label="Ícone do app, 32 pixels" width="24" height="24" viewBox="0 0 64 64"><path d="M18 24 H46 L18 50 H46" fill="none" stroke="#F4F1EA" stroke-width="7.5" stroke-linejoin="miter" stroke-linecap="square"></path><circle cx="32" cy="11" r="5.5" fill="#F4F1EA"></circle></svg>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #5B6170">32 px</span>
    </div>
    <div style="width: 1px; height: 64px; background: #E4E6EB"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="height: 32px; display: flex; align-items: center">
        <svg role="img" aria-label="Monograma na barra de tarefas, 16 pixels" width="16" height="16" viewBox="0 0 64 64"><path d="M18 26 H46 L18 52 H46" fill="none" stroke="#172036" stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"></path><circle cx="32" cy="10" r="7" fill="#172036"></circle></svg>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #5B6170">Barra de tarefas · 16 px</span>
    </div>
  </div>
</div></div>
</body>
</html>

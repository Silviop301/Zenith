.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}

        <span style="width: 32px; height: 32px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="16 pixels, em repouso" width="16" height="16" viewBox="0 0 64 64"><circle cx="32" cy="35" r="18" fill="none" stroke="#172036" stroke-width="8"></circle><circle cx="32" cy="17" r="9" fill="#172036" stroke="#FFFFFF" stroke-width="4"></circle></svg></span>
        <span style="width: 32px; height: 32px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="16 pixels, modo gamer ativo" width="16" height="16" viewBox="0 0 64 64"><circle cx="32" cy="35" r="18" fill="none" stroke="#172036" stroke-width="8"></circle><circle cx="32" cy="17" r="10" fill="#6B5B8E" stroke="#FFFFFF" stroke-width="4"></circle></svg></span>

      <svg role="img" aria-label="Variação 5: pico com o ponto acima" width="96" height="96" viewBox="0 0 64 64"><path d="M8 46 L32 28 L56 46" fill="none" stroke="#172036" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="32" cy="16" r="4.6" fill="#172036"></circle></svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 14px; font-weight: 800">5 · Pico</span><span style="font-size: 12px; color: #5B6170; text-align: center">O ponto acima do cume</span></div>
      <div style="display: flex; gap: 10px">
        <span style="width: 32px; height: 32px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="16 pixels, em repouso" width="16" height="16" viewBox="0 0 64 64"><path d="M8 50 L32 32 L56 50" fill="none" stroke="#172036" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="32" cy="16" r="7.5" fill="#172036"></circle></svg></span>

<text x="112" y="191" font-size="13" font-weight="600" fill="#1A1D24" text-anchor="start">Resgate grátis (lançamento)</text>
<text x="112" y="209" font-size="11.5" font-weight="400" fill="#5B6170" text-anchor="start">Varredura, achados, aplicar e desfazer, guias; a coleta de sensores começa aqui</text>
